<!DOCTYPE html>
<html>
<head>
<title>Aruuu Dimension</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cinzel&display=swap" rel="stylesheet">

<style>

body{
background:black;
color:#00ff88;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
margin:0;
}

/* MATRIX BACKGROUND */

canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* BOOT TERMINAL */

#boot{
position:absolute;
bottom:120px;
right:180px;
width:450px;
font-size:18px;
line-height:1.7;
}

/* LOADER */

#loader{
position:absolute;
bottom:80px;
right:180px;
display:none;
}

.loadingDots::after{
content:'';
animation:dots 1.5s infinite;
}

@keyframes dots{
0%{content:'';}
33%{content:'.';}
66%{content:'..';}
100%{content:'...';}
}

/* SECURITY SCREEN */

#securityBox{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
font-family:'Cinzel', serif;
color:red;
}

/* RITUAL SYMBOL */

.ritual{
font-size:100px;
color:white;
margin-bottom:20px;
animation:floatSpin 6s ease-in-out infinite;
}

/* FLOAT + SPIN */

@keyframes floatSpin{

0%{
transform:translateY(0px) rotate(0deg);
}

50%{
transform:translateY(-25px) rotate(180deg);
}

100%{
transform:translateY(0px) rotate(360deg);
}

}

/* DASHBOARD */

#dashboard{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
}

textarea{
width:420px;
height:200px;
background:black;
color:#00ff88;
border:1px solid #00ff88;
}

button{
background:#00ff88;
color:black;
border:none;
padding:8px 14px;
cursor:pointer;
}

/* SECRET CONSOLE */

#console{
display:none;
position:absolute;
bottom:20px;
left:20px;
background:black;
border:1px solid #00ff88;
padding:10px;
}

#console input{
background:black;
border:none;
color:#00ff88;
outline:none;
width:260px;
}

</style>
</head>

<body>

<canvas id="matrix"></canvas>

<div id="boot"></div>

<div id="loader">
loading<span class="loadingDots"></span>

<!-- SECURITY SCREEN -->

<div class="ritual">⚚</div>

<div>

⟁ ᚨᛒᛁᛋᛋ ᛏᛟ ᛏᚺᛖ ᚢᚾᚴᚾᛟᚹᚾ ⟁ <br>

</div>

<!-- DASHBOARD -->

<!-- FIREBASE -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey:"AIzaSyCmUw12qALP4k_ZU4xBVSw0OPn4pDzd-9Q",
authDomain:"aruuu-dashboard.firebaseapp.com",
projectId:"aruuu-dashboard",
storageBucket:"aruuu-dashboard.firebasestorage.app",
messagingSenderId:"109570038436",
appId:"1:109570038436:web:f3371737635a33ef4d2431"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const docRef = doc(db,"dashboard","notes");

async function loadNote(){

const snap = await getDoc(docRef);

if(snap.exists()){
document.getElementById("notes").value = snap.data().text;
}

}

window.saveNote = async function(){

let text=document.getElementById("notes").value;

await setDoc(docRef,{text:text});

alert("Saved to cloud!");

}

loadNote();

</script>

<script>

/* MATRIX RAIN */

const canvas=document.getElementById("matrix");
const ctx=canvas.getContext("2d");

canvas.height=window.innerHeight;
canvas.width=window.innerWidth;

const letters="01ΔRUUU";
const fontSize=16;
const columns=canvas.width/fontSize;

const drops=[];

for(let x=0;x<columns;x++)
drops[x]=1;

function draw(){

ctx.fillStyle="rgba(0,0,0,0.05)";
ctx.fillRect(0,0,canvas.width,canvas.height);

ctx.fillStyle="#00ff88";
ctx.font=fontSize+"px monospace";

for(let i=0;i<drops.length;i++){

const text=letters.charAt(Math.floor(Math.random()*letters.length));

ctx.fillText(text,i*fontSize,drops[i]*fontSize);

if(drops[i]*fontSize>canvas.height && Math.random()>0.975)
drops[i]=0;

drops[i]++;

}

}

setInterval(draw,33);

/* BOOT TEXT */

const lines=[
"> initializing ΔRUUU DIMENSION...",
"> opening abyss channel...",
"> unknown presence detected...",
"> decrypting ancient language...",
"> ritual authentication required..."
];

let lineIndex=0;
let charIndex=0;

function typeLine(){

if(lineIndex>=lines.length){

document.getElementById("loader").style.display="block";

setTimeout(()=>{
document.getElementById("boot").style.display="none";
document.getElementById("loader").style.display="none";
document.getElementById("securityBox").style.display="block";
},2000);

return;

}

let boot=document.getElementById("boot");

if(charIndex===0){

let div=document.createElement("div");
boot.appendChild(div);

}

let currentLine=lines[lineIndex];
let currentDiv=boot.lastChild;

currentDiv.textContent+=currentLine[charIndex];

charIndex++;

if(charIndex<currentLine.length){

setTimeout(typeLine,30);

}else{

charIndex=0;
lineIndex++;
setTimeout(typeLine,500);

}

}

/* PASSWORD */

function check(){

let ans=document.getElementById("answer").value;

if(ans==="诺拉"){

document.getElementById("securityBox").style.display="none";
document.getElementById("dashboard").style.display="block";

}else{

alert("access denied");

}

}

/* SECRET CONSOLE */

document.addEventListener("keydown",function(e){

if(e.key==="`"){

let c=document.getElementById("console");

c.style.display = c.style.display==="none" ? "block":"none";

}

});

document.getElementById("cmd").addEventListener("keydown",function(e){

if(e.key==="Enter"){

let v=this.value;

if(v==="admin aruuu"){

alert("ADMIN ACCESS GRANTED");

document.getElementById("dashboard").style.display="block";

}

this.value="";

}

});

/* START */

window.onload=function(){

typeLine();

}

/* SOUND PLAY ON FIRST CLICK */

document.addEventListener("click",function(){

document.getElementById("bootSound").play();

},{once:true});

</script>

</body>
</html>
