<!DOCTYPE html>
<html>
<head>
<title>Aruuu Dimension</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cinzel&display=swap" rel="stylesheet">

<style>

body{
background:black;
color:#00ff88;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

#boot{
position:absolute;
bottom:120px;
right:180px;
width:450px;
font-size:18px;
line-height:1.7;
}

#securityBox{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
font-family:'Cinzel', serif;
}

.ritual{
font-size:70px;
margin-bottom:20px;
}

textarea{
width:420px;
height:200px;
background:black;
color:#00ff88;
border:1px solid #00ff88;
}

button{
background:#00ff88;
color:black;
border:none;
padding:8px 14px;
cursor:pointer;
}

</style>
</head>

<body>

<div id="boot"></div>

<div id="securityBox">

<div class="ritual">⚚</div>

<div>

⟁ ᚨᛒᛁᛋᛋ ᛏᛟ ᛏᚺᛖ ᚢᚾᚴᚾᛟᚹᚾ ⟁ <br>
ᚨᚱᚢᚢᚢ ᛞᛁᛗᛖᚾᛋᛁᛟᚾ <br>
ᚨᚲᚲᛖᛋᛋᛟᚱ ᚹᚺᛟᛗ?

</div>

<br>

<input id="answer">
<button onclick="check()">enter</button>

</div>

<div id="dashboard" style="display:none;">

<h1>⚡ Aaron OS</h1>
<p>Personal Matrix</p>

<h3>Notes</h3>

<textarea id="notes"></textarea>

<br><br>

<button onclick="saveNote()">Save</button>

</div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCmUw12qALP4k_ZU4xBVSw0OPn4pDzd-9Q",
  authDomain: "aruuu-dashboard.firebaseapp.com",
  projectId: "aruuu-dashboard",
  storageBucket: "aruuu-dashboard.firebasestorage.app",
  messagingSenderId: "109570038436",
  appId: "1:109570038436:web:f3371737635a33ef4d2431",
  measurementId: "G-M1W5NXVT2Z"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const docRef = doc(db, "dashboard", "notes");

async function loadNote(){

const snap = await getDoc(docRef);

if(snap.exists()){
document.getElementById("notes").value = snap.data().text;
}

}

window.saveNote = async function(){

let text = document.getElementById("notes").value;

await setDoc(docRef,{text:text});

alert("Saved to cloud!");

}

loadNote();

</script>

<script>

const lines = [
"> initializing ΔRUUU DIMENSION...",
"> opening abyss channel...",
"> unknown presence detected...",
"> decrypting ancient language...",
"> ritual authentication required..."
];

let i = 0;

function boot(){

if(i < lines.length){

let div = document.createElement("div");
div.textContent = lines[i];
document.getElementById("boot").appendChild(div);

i++;

setTimeout(boot,1200);

}else{

setTimeout(()=>{

document.getElementById("boot").style.display="none";
document.getElementById("securityBox").style.display="block";

},1200);

}

}

function check(){

let ans = document.getElementById("answer").value;

if(ans === "诺拉"){

document.getElementById("securityBox").style.display="none";
document.getElementById("dashboard").style.display="block";

}else{

alert("access denied");

}

}

boot();

</script>

</body>
</html>
