<!DOCTYPE html>
<html>
<head>
<title>Aruuu Dimension</title>

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cinzel&display=swap" rel="stylesheet">

<style>

body{
background:black;
color:#00ff88;
font-family:'Share Tech Mono', monospace;
overflow:hidden;
}

/* boot terminal */

#boot{
position:absolute;
bottom:120px;
right:180px;
width:450px;
font-size:18px;
line-height:1.7;
}

/* loading animation */

#loader{
position:absolute;
bottom:80px;
right:180px;
display:none;
}

.loadingDots::after{
content:'';
animation:dots 1.5s infinite;
}

@keyframes dots{
0%{content:'';}
33%{content:'.';}
66%{content:'..';}
100%{content:'...';}
}

/* ritual screen */

#securityBox{
display:none;
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
text-align:center;
font-family:'Cinzel', serif;
color:#aa0000;
}

/* ritual symbol */

.ritual{
font-size:80px;
margin-bottom:20px;
color:#ff0000;
animation:floatUp 3s ease-in-out infinite;
}

/* floating upward */

@keyframes floatUp{
0%{transform:translateY(0);}
50%{transform:translateY(-10px);}
100%{transform:translateY(0);}
}

/* blood drip */

.drip{
width:4px;
height:20px;
background:#ff0000;
margin:0 auto;
animation:drip 2s infinite;
}

@keyframes drip{
0%{height:0;}
50%{height:25px;}
100%{height:0;}
}

/* dashboard */

textarea{
width:420px;
height:200px;
background:black;
color:#00ff88;
border:1px solid #00ff88;
}

button{
background:#00ff88;
color:black;
border:none;
padding:8px 14px;
cursor:pointer;
}

</style>
</head>

<body>

<div id="boot"></div>

<div id="loader">
loading<span class="loadingDots"></span>
</div>

<!-- ritual screen -->

<div id="securityBox">

<div class="ritual">⚚</div>
<div class="drip"></div>

<div>

⟁ ᚨᛒᛁᛋᛋ ᛏᛟ ᛏᚺᛖ ᚢᚾᚴᚾᛟᚹᚾ ⟁ <br>
ᚨᚱᚢᚢᚢ ᛞᛁᛗᛖᚾᛋᛁᛟᚾ <br>
ᚨᚲᚲᛖᛋᛋᛟᚱ ᚹᚺᛟᛗ?

</div>

<br>

<input id="answer">
<button onclick="check()">enter</button>

</div>

<!-- dashboard -->

<div id="dashboard" style="display:none;">

<h1>⚡ Aaron OS</h1>

<p>Personal Matrix</p>

<h3>Notes</h3>

<textarea id="notes"></textarea>

<br><br>

<button onclick="saveNote()">Save</button>

</div>

<!-- dark ambient soundtrack -->

<audio id="bootSound" loop>
<source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_5e6f86f5c1.mp3?filename=dark-ambience-110357.mp3">
</audio>

<!-- firebase -->

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, setDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
apiKey: "AIzaSyCmUw12qALP4k_ZU4xBVSw0OPn4pDzd-9Q",
authDomain: "aruuu-dashboard.firebaseapp.com",
projectId: "aruuu-dashboard",
storageBucket: "aruuu-dashboard.firebasestorage.app",
messagingSenderId: "109570038436",
appId: "1:109570038436:web:f3371737635a33ef4d2431"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const docRef = doc(db,"dashboard","notes");

async function loadNote(){

const snap = await getDoc(docRef);

if(snap.exists()){
document.getElementById("notes").value = snap.data().text;
}

}

window.saveNote = async function(){

let text=document.getElementById("notes").value;

await setDoc(docRef,{text:text});

alert("Saved to cloud!");

}

loadNote();

</script>

<!-- boot animation -->

<script>

const lines=[
"> initializing ΔRUUU DIMENSION...",
"> opening abyss channel...",
"> unknown presence detected...",
"> decrypting ancient language...",
"> ritual authentication required..."
];

let lineIndex=0;
let charIndex=0;

function typeLine(){

if(lineIndex>=lines.length){

document.getElementById("loader").style.display="block";

setTimeout(()=>{

document.getElementById("boot").style.display="none";
document.getElementById("loader").style.display="none";
document.getElementById("securityBox").style.display="block";

},2500);

return;

}

let boot=document.getElementById("boot");

if(charIndex===0){

let div=document.createElement("div");
boot.appendChild(div);

}

let currentLine=lines[lineIndex];
let currentDiv=boot.lastChild;

currentDiv.textContent+=currentLine[charIndex];

charIndex++;

if(charIndex<currentLine.length){

setTimeout(typeLine,30);

}else{

charIndex=0;
lineIndex++;

setTimeout(typeLine,500);

}

}

function check(){

let ans=document.getElementById("answer").value;

if(ans==="诺拉"){

document.getElementById("securityBox").style.display="none";
document.getElementById("dashboard").style.display="block";

}else{

alert("access denied");

}

}

window.onload=function(){

document.getElementById("bootSound").play();
typeLine();

}

</script>

</body>
</html>
