<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aruuu Dimension</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cinzel&display=swap" rel="stylesheet">
<style>
/* BODY & BACKGROUND */
body{
  background:black;
  color:#00ff88;
  font-family:'Share Tech Mono', monospace;
  overflow:hidden;
  margin:0;
}

/* MATRIX BACKGROUND */
canvas{
  position:fixed;
  top:0;
  left:0;
  z-index:-1;
}

/* BOOT TERMINAL */
#boot{
  position:absolute;
  bottom:120px;
  right:180px;
  width:450px;
  font-size:18px;
  line-height:1.7;
}

/* LOADER */
#loader{
  position:absolute;
  bottom:80px;
  right:180px;
  display:none;
}
.loadingDots::after{
  content:'';
  animation:dots 1.5s infinite;
}
@keyframes dots{
  0%{content:'';}
  33%{content:'.';}
  66%{content:'..';}
  100%{content:'...';}
}

/* SECURITY SCREEN */
#securityBox{
  display:block;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  font-family:'Cinzel', serif;
  color:#00ff88;
  width:90%;
  max-width:700px;
}

.ritual{
  font-size:100px;
  color:white;
  margin-bottom:20px;
  animation:floatSpin 6s ease-in-out infinite;
}

@keyframes floatSpin{
  0%{transform:translateY(0px) rotate(0deg);}
  50%{transform:translateY(-25px) rotate(180deg);}
  100%{transform:translateY(0px) rotate(360deg);}
}

.runicBlock{
  margin-bottom:28px;
}

.runicText{
  color:#00ff88;
  font-size:24px;
  margin:6px 0;
  letter-spacing:2px;
  text-shadow:0 0 6px rgba(0,255,136,0.35);
}

.translation{
  margin-top:14px;
  color:#9dffcb;
  font-size:16px;
  letter-spacing:1px;
}

#enterGateBtn{
  background:rgba(0,255,136,0.10);
  color:#00ff88;
  border:1px solid #00ff88;
  padding:14px 42px;
  font-size:20px;
  font-family:'Share Tech Mono', monospace;
  border-radius:14px;
  cursor:pointer;
  box-shadow:0 0 10px rgba(0,255,136,0.35), 0 0 20px rgba(0,255,136,0.18);
  transition:all .25s ease;
  animation:enterPulse 2.2s ease-in-out infinite;
}
#enterGateBtn:hover{
  transform:scale(1.05);
  background:rgba(0,255,136,0.16);
  box-shadow:0 0 16px rgba(0,255,136,0.55), 0 0 32px rgba(0,255,136,0.25);
}
@keyframes enterPulse{
  0%,100%{box-shadow:0 0 10px rgba(0,255,136,0.35),0 0 20px rgba(0,255,136,0.18);}
  50%{box-shadow:0 0 18px rgba(0,255,136,0.55),0 0 36px rgba(0,255,136,0.28);}
}

#glitchMsg{
  margin-top:22px;
  min-height:40px;
  font-size:22px;
  color:#ff2a2a;
  font-family:'Share Tech Mono', monospace;
  opacity:0;
  transform:translateY(-30px);
  transition:all .35s ease;
  text-shadow:2px 0 #00ffff,-2px 0 #ff00ff,0 0 8px rgba(255,0,0,0.5);
}
#glitchMsg.show{
  opacity:1;
  transform:translateY(0);
  animation:glitchShake 0.35s linear 3;
}
@keyframes glitchShake{
  0%{transform:translate(0,0);}
  20%{transform:translate(-2px,1px);}
  40%{transform:translate(2px,-1px);}
  60%{transform:translate(-1px,2px);}
  80%{transform:translate(1px,-2px);}
  100%{transform:translate(0,0);}
}

/* DASHBOARD */
#dashboard{
  display:none;
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  text-align:center;
  width:90%;
  max-width:1200px;
}

.box{
  display:inline-block;
  vertical-align:top;
  width:48%;
  height:350px;
  margin:1%;
  background:rgba(0,0,0,0.85);
  border:1px solid #00ff88;
  padding:12px;
  box-sizing:border-box;
  overflow:auto;
  border-radius:8px;
}

#privateFindsBox{
  position:absolute;
  bottom:20px;
  left:50%;
  transform:translateX(-50%);
  width:96%;
  background:rgba(0,0,0,0.95);
  border:1px solid #00ff88;
  padding:10px;
  border-radius:6px;
  box-sizing:border-box;
  text-align:left;
  max-height:150px;
  overflow:auto;
}

/* Buttons */
button{
  background:#00ff88;
  color:black;
  border:none;
  padding:6px 12px;
  cursor:pointer;
  margin:2px;
  font-family:'Share Tech Mono', monospace;
}
button:hover{opacity:0.85;}

/* Inputs */
input, textarea{
  width:100%;
  box-sizing:border-box;
  margin:4px 0;
  font-family:'Share Tech Mono', monospace;
  font-size:14px;
  background:black;
  color:#00ff88;
  border:1px solid #00ff88;
  border-radius:4px;
  padding:4px;
}
</style>
</head>
<body>

<canvas id="matrix"></canvas>

<!-- SECURITY SCREEN -->
<div id="securityBox">
  <div class="ritual">⚚</div>
  <div class="runicBlock">
    <div class="runicText">ᚨᚱᚢᚢᚢ ᛞᛁᛗᛖᚾᛋᛁᛟᚾ</div>
    <div class="runicText">ᛁᛞᛚᛖ ᚱᛁᚠᛏ</div>
    <div class="runicText">ᚨᚲᚲᛖᛋᛋ ᚦᛖ ᛞᛟᛗᚨᛁᚾ</div>
    <div class="translation">Proceed to Aruuu Domain</div>
  </div>
  <button id="enterGateBtn" onclick="triggerGate()">ENTER</button>
  <div id="glitchMsg"></div>
</div>

<!-- DASHBOARD -->
<div id="dashboard">
  <h1>⚡ Aruuu Dimension</h1>
  <div class="box" id="memoryBoosterBox">
    <h3>Memory Booster</h3>
    <div id="memoryNumbers" style="font-size:20px;"></div>
    <button onclick="startMemory()">Start</button>
    <button onclick="stopMemory()">Stop</button>
  </div>
  <div class="box" id="findMissingBox">
    <h3>Find the Missing</h3>
    <canvas id="missingCanvas" width="400" height="300"></canvas>
    <button onclick="startFindMissing()">Start</button>
    <button onclick="stopFindMissing()">Stop</button>
  </div>
  <div id="privateFindsBox">
    <h3>Private Finds</h3>
    <button onclick="addNote()">+ Note</button>
    <div id="notesContainer"></div>
    <button onclick="addLink()">+ Link</button>
    <div id="linksContainer"></div>
  </div>
</div>

<!-- SCRIPTS -->
<script>
// MATRIX RAIN
const canvas = document.getElementById("matrix");
const ctx = canvas.getContext("2d");
canvas.height = window.innerHeight;
canvas.width = window.innerWidth;
const letters = "01ΔRUUU";
const fontSize = 16;
const columns = canvas.width/fontSize;
const drops = Array(columns).fill(1);
function draw(){
  ctx.fillStyle = "rgba(0,0,0,0.05)";
  ctx.fillRect(0,0,canvas.width,canvas.height);
  ctx.fillStyle="#00ff88";
  ctx.font=fontSize+"px monospace";
  for(let i=0;i<drops.length;i++){
    const text=letters.charAt(Math.floor(Math.random()*letters.length));
    ctx.fillText(text,i*fontSize,drops[i]*fontSize);
    if(drops[i]*fontSize>canvas.height && Math.random()>0.975) drops[i]=0;
    drops[i]++;
  }
}
setInterval(draw,33);

// HIDDEN PASSWORD GATE
let hiddenInput = "";
let gateTriggered = false;
function triggerGate(){
  gateTriggered = true;
  hiddenInput = "";
  const msg = document.getElementById("glitchMsg");
  msg.textContent = "Unknown Error !!!";
  msg.classList.remove("show");
  setTimeout(() => msg.classList.add("show"), 40);
  setTimeout(() => msg.classList.remove("show"), 2500);
}
function enterDomain(){
  document.getElementById("securityBox").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
}
document.addEventListener("keydown", function(e){
  if(!gateTriggered) return;
  if(e.key === "Enter"){
    if(hiddenInput.toLowerCase() === "noraa") enterDomain();
    hiddenInput = ""; // silent reset
    return;
  }
  if(e.key === "Backspace") hiddenInput = hiddenInput.slice(0,-1);
  if(e.key.length===1){
    hiddenInput+=e.key;
    if(hiddenInput.length>20) hiddenInput=hiddenInput.slice(-20);
  }
});

// MEMORY BOOSTER
let memInterval;
function startMemory(){
  const display = document.getElementById("memoryNumbers");
  let numbers=[];
  memInterval = setInterval(()=>{
    numbers = Array.from({length:6}, ()=>Math.floor(Math.random()*90)+10);
    display.textContent = numbers.join(" ");
  },1500);
}
function stopMemory(){
  clearInterval(memInterval);
}

// FIND THE MISSING (simplified)
let findInterval, shapes = [];
const canvasFM = document.getElementById("missingCanvas");
const ctxFM = canvasFM.getContext("2d");
function drawPattern(){
  ctxFM.clearRect(0,0,canvasFM.width,canvasFM.height);
  shapes.forEach(s=>{
    ctxFM.fillStyle=s.color;
    ctxFM.fillRect(s.x,s.y,s.size,s.size);
  });
}
function startFindMissing(){
  shapes = [];
  for(let i=0;i<20;i++){
    shapes.push({x:Math.random()*350,y:Math.random()*250,size:20,color:"#00ff88"});
  }
  drawPattern();
  setTimeout(()=>{
    // remove some for missing
    for(let i=0;i<5;i++) shapes[i].color="#000";
    drawPattern();
  },15000);
}
function stopFindMissing(){
  shapes=[]; drawPattern();
}

// PRIVATE FINDS
const notesContainer=document.getElementById("notesContainer");
const linksContainer=document.getElementById("linksContainer");
function addNote(){
  const div = document.createElement("div");
  div.innerHTML = `<input placeholder="Heading"><textarea placeholder="Content"></textarea><button onclick="this.parentNode.remove()">Delete</button>`;
  notesContainer.appendChild(div);
}
function addLink(){
  const div = document.createElement("div");
  div.innerHTML = `<input placeholder="Heading"><input placeholder="URL"><button onclick="this.parentNode.remove()">Delete</button>`;
  linksContainer.appendChild(div);
}

// START
window.onload=function(){};
</script>
</body>
</html>
