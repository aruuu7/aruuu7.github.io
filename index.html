<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aruuu Dimension // Idle Rift</title>

  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#000;
      --green:#00ff88;
      --green-soft:rgba(0,255,136,0.12);
      --green-border:rgba(0,255,136,0.45);
      --red:#ff3b3b;
      --white:#e8fff4;
      --shadow:0 0 18px rgba(0,255,136,0.18);
    }

    *{ box-sizing:border-box; }

    body{
      margin:0;
      background:var(--bg);
      color:var(--green);
      font-family:'Share Tech Mono', monospace;
      overflow:hidden;
    }

    canvas{
      position:fixed;
      inset:0;
      z-index:-2;
    }

    .scan{
      position:fixed;
      inset:0;
      pointer-events:none;
      background:repeating-linear-gradient(
        to bottom,
        rgba(0,255,136,0.02) 0px,
        rgba(0,255,136,0.02) 1px,
        rgba(0,0,0,0) 2px,
        rgba(0,0,0,0) 4px
      );
      z-index:-1;
    }

    .screen{
      display:none;
      width:100vw;
      height:100vh;
      position:relative;
    }

    .show{
      display:block;
    }

    /* BOOT */
    #bootScreen{
      padding:30px;
    }

    #boot{
      position:absolute;
      bottom:120px;
      right:140px;
      width:min(520px, 90vw);
      font-size:18px;
      line-height:1.7;
      text-shadow:0 0 8px rgba(0,255,136,0.3);
    }

    #loader{
      position:absolute;
      bottom:80px;
      right:140px;
      display:none;
      font-size:16px;
      opacity:0.95;
    }

    .loadingDots::after{
      content:'';
      animation:dots 1.5s infinite;
    }

    @keyframes dots{
      0%{content:'';}
      33%{content:'.';}
      66%{content:'..';}
      100%{content:'...';}
    }

    /* GATE */
    #securityBox{
      display:none;
      position:absolute;
      top:50%;
      left:50%;
      transform:translate(-50%,-50%);
      text-align:center;
      width:min(760px, 92vw);
      padding:28px 24px;
      border:1px solid var(--green-border);
      background:rgba(0,0,0,0.72);
      box-shadow:var(--shadow);
      border-radius:18px;
      backdrop-filter: blur(4px);
    }

    .ritual{
      font-size:82px;
      color:var(--green);
      margin-bottom:14px;
      animation:floatSpin 8s ease-in-out infinite;
      text-shadow:0 0 18px rgba(0,255,136,0.35);
    }

    @keyframes floatSpin{
      0%{ transform:translateY(0px) rotate(0deg); }
      50%{ transform:translateY(-12px) rotate(180deg); }
      100%{ transform:translateY(0px) rotate(360deg); }
    }

    .runic{
      font-family:'Cinzel', serif;
      color:var(--green);
      font-size:clamp(18px, 2.2vw, 28px);
      line-height:1.7;
      letter-spacing:1px;
      text-shadow:0 0 10px rgba(0,255,136,0.2);
    }

    .translation{
      margin-top:14px;
      font-size:14px;
      color:#9dffcf;
      opacity:0.9;
    }

    .domainPrompt{
      margin-top:18px;
      font-size:18px;
      color:#d6ffe9;
      letter-spacing:1px;
    }

    .gateControls{
      margin-top:22px;
      display:flex;
      justify-content:center;
      gap:10px;
      flex-wrap:wrap;
    }

    input, textarea, select, button{
      font-family:'Share Tech Mono', monospace;
    }

    #answer{
      width:min(320px, 70vw);
      background:#030503;
      color:var(--green);
      border:1px solid var(--green-border);
      border-radius:12px;
      padding:12px 14px;
      outline:none;
      font-size:15px;
    }

    .btn{
      background:linear-gradient(180deg, #00ff88 0%, #00c86a 100%);
      color:#001c10;
      border:none;
      padding:12px 18px;
      border-radius:12px;
      cursor:pointer;
      font-weight:700;
      letter-spacing:0.5px;
      box-shadow:0 0 16px rgba(0,255,136,0.18);
      transition:transform .15s ease, box-shadow .2s ease;
    }

    .btn:hover{
      transform:translateY(-1px);
      box-shadow:0 0 22px rgba(0,255,136,0.28);
    }

    .btn.secondary{
      background:transparent;
      color:var(--green);
      border:1px solid var(--green-border);
    }

    /* IDLE RIFT */
    #riftScreen{
      padding:24px;
      display:none;
    }

    .riftWrap{
      display:flex;
      flex-direction:column;
      height:100%;
      gap:18px;
    }

    .riftHeader{
      text-align:center;
      padding-top:6px;
    }

    .riftTitle{
      font-family:'Cinzel', serif;
      font-size:clamp(26px, 3.6vw, 48px);
      color:#d9ffee;
      margin:0;
      text-shadow:0 0 14px rgba(0,255,136,0.18);
    }

    .riftSub{
      margin-top:6px;
      color:#93ffcb;
      font-size:14px;
      letter-spacing:1px;
    }

    .gameGrid{
      flex:1;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:18px;
      min-height:0;
    }

    .panel{
      border:1px solid var(--green-border);
      background:rgba(0,0,0,0.68);
      border-radius:18px;
      box-shadow:var(--shadow);
      padding:16px;
      position:relative;
      overflow:hidden;
      min-height:0;
      display:flex;
      flex-direction:column;
    }

    .panelTitle{
      font-family:'Cinzel', serif;
      font-size:24px;
      color:#d9ffee;
      margin-bottom:6px;
    }

    .panelSub{
      color:#8fffc8;
      font-size:13px;
      margin-bottom:12px;
    }

    .topRight{
      position:absolute;
      top:14px;
      right:14px;
    }

    .controls{
      display:flex;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      margin-bottom:12px;
    }

    .controls select,
    .controls input{
      background:#030503;
      color:var(--green);
      border:1px solid var(--green-border);
      border-radius:10px;
      padding:10px 12px;
      outline:none;
    }

    .gameArea{
      flex:1;
      border:1px dashed rgba(0,255,136,0.25);
      border-radius:16px;
      padding:14px;
      overflow:auto;
      background:rgba(0,255,136,0.02);
    }

    .status{
      margin-top:10px;
      min-height:20px;
      font-size:13px;
      color:#baffdf;
    }

    /* Memory */
    #memoryDisplay{
      font-size:clamp(28px, 4vw, 52px);
      text-align:center;
      letter-spacing:8px;
      color:#dffff0;
      margin-top:24px;
      word-break:break-all;
      text-shadow:0 0 12px rgba(0,255,136,0.18);
    }

    .memoryInputRow{
      margin-top:18px;
      display:flex;
      gap:10px;
      justify-content:center;
      flex-wrap:wrap;
    }

    #memoryAnswer{
      width:min(360px, 90%);
      background:#030503;
      color:var(--green);
      border:1px solid var(--green-border);
      border-radius:12px;
      padding:12px 14px;
      font-size:16px;
      display:none;
    }

    /* Shapes */
    #shapeDisplay{
      display:grid;
      grid-template-columns:repeat(4, 1fr);
      gap:12px;
      align-content:start;
    }

    .shape{
      aspect-ratio:1/1;
      border:1px solid rgba(0,255,136,0.35);
      border-radius:14px;
      background:rgba(0,255,136,0.05);
      display:flex;
      align-items:center;
      justify-content:center;
      position:relative;
      box-shadow:inset 0 0 18px rgba(0,255,136,0.03);
      cursor:pointer;
    }

    .shape::before{
      content:'';
      width:58%;
      height:58%;
      display:block;
      background:#00ff88;
      box-shadow:0 0 14px rgba(0,255,136,0.22);
    }

    .circle::before{ border-radius:50%; }
    .square::before{ border-radius:8px; }
    .diamond::before{ transform:rotate(45deg); border-radius:6px; }
    .triangle::before{
      width:0; height:0; background:none;
      border-left:28px solid transparent;
      border-right:28px solid transparent;
      border-bottom:48px solid #00ff88;
      box-shadow:none;
    }

    .hiddenShape{
      opacity:0.18;
      border-style:dashed;
    }

    .selectedMissing{
      outline:2px solid #dffff0;
      box-shadow:0 0 0 2px rgba(0,255,136,0.2), 0 0 18px rgba(0,255,136,0.18);
    }

    /* Bottom bar */
    .bottomBar{
      display:flex;
      justify-content:center;
      align-items:center;
    }

    .privateFindsBtn{
      width:min(960px, 100%);
      border:1px solid var(--green-border);
      background:rgba(0,0,0,0.72);
      color:#dffff0;
      border-radius:16px;
      padding:14px 18px;
      cursor:pointer;
      text-align:center;
      font-family:'Cinzel', serif;
      font-size:20px;
      box-shadow:var(--shadow);
    }

    /* PRIVATE FINDS */
    #privateScreen{
      padding:18px;
      display:none;
    }

    .privateWrap{
      height:100%;
      display:flex;
      flex-direction:column;
      gap:14px;
    }

    .privateHeader{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }

    .privateTitle{
      font-family:'Cinzel', serif;
      font-size:clamp(22px, 3vw, 38px);
      color:#e4fff3;
    }

    .tabs{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
    }

    .tabBtn{
      background:transparent;
      color:var(--green);
      border:1px solid var(--green-border);
      padding:10px 14px;
      border-radius:12px;
      cursor:pointer;
    }

    .tabBtn.active{
      background:rgba(0,255,136,0.12);
      color:#e4fff3;
    }

    .privateBody{
      flex:1;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
      min-height:0;
    }

    .card{
      border:1px solid var(--green-border);
      border-radius:18px;
      background:rgba(0,0,0,0.68);
      box-shadow:var(--shadow);
      padding:14px;
      overflow:auto;
      display:none;
    }

    .card.showCard{
      display:block;
    }

    .card h3{
      margin-top:0;
      color:#e4fff3;
      font-family:'Cinzel', serif;
    }

    textarea{
      width:100%;
      min-height:220px;
      background:#030503;
      color:var(--green);
      border:1px solid var(--green-border);
      border-radius:12px;
      padding:12px;
      resize:vertical;
      outline:none;
    }

    .miniInput{
      width:100%;
      background:#030503;
      color:var(--green);
      border:1px solid var(--green-border);
      border-radius:12px;
      padding:12px;
      outline:none;
      margin-bottom:10px;
    }

    .list{
      display:flex;
      flex-direction:column;
      gap:10px;
      margin-top:10px;
    }

    .listItem{
      border:1px solid rgba(0,255,136,0.25);
      border-radius:12px;
      padding:10px;
      background:rgba(0,255,136,0.03);
      word-break:break-word;
    }

    .listItem a{
      color:#9dffcf;
    }

    .twoCol{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:14px;
    }

    .customBox{
      min-height:140px;
      border:1px dashed rgba(0,255,136,0.25);
      border-radius:14px;
      padding:12px;
      background:rgba(0,255,136,0.02);
    }

    .hint{
      font-size:12px;
      color:#9dffcf;
      opacity:0.9;
      margin-top:8px;
    }

    @media (max-width: 980px){
      body{ overflow:auto; }
      #riftScreen, #privateScreen{ height:auto; min-height:100vh; }
      .gameGrid, .privateBody, .twoCol{
        grid-template-columns:1fr;
      }
      #boot{
        right:20px;
        bottom:110px;
      }
      #loader{
        right:20px;
      }
      #shapeDisplay{
        grid-template-columns:repeat(3, 1fr);
      }
    }
  </style>
</head>
